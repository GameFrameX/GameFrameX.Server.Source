# ==============================================================================
# CNB 云原生构建流水线（文档：https://docs.cnb.cool/zh/build/grammar.html）
#
# 事件划分：
#   1. pull_request（所有分支）：构建 + 测试，PR 质量门禁
#   2. main push：构建 + 测试 + Docker 镜像构建推送（CNB Docker 制品库，latest + 短提交号）
#   3. main tag_push：构建 + 测试 + Docker 镜像推送（版本 Tag 镜像 + latest）
#   4. vscode（分支页「云原生开发」按钮）：一键启动 MongoDB + Game + Social
#      在线示例服务，通过端口预览对外提供访问
#
# 镜像产物：${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:{latest|<tag>|<commit>}
# ==============================================================================

(**):
  pull_request:
    - name: 构建与测试
      docker:
        image: mcr.microsoft.com/dotnet/sdk:10.0
      runner:
        cpus: 4
      stages:
        - name: 还原依赖
          script: dotnet restore Server.slnx
        - name: 构建
          script: dotnet build Server.slnx -c Release --nologo
        - name: 单元测试
          script: dotnet test Server.slnx -c Release --no-build --nologo

main:
  push:
    - name: 构建测试并发布镜像
      docker:
        image: mcr.microsoft.com/dotnet/sdk:10.0
      runner:
        cpus: 4
      services:
        - docker
      stages:
        - name: 还原依赖
          script: dotnet restore Server.slnx
        - name: 构建
          script: dotnet build Server.slnx -c Release --nologo
        - name: 单元测试
          script: dotnet test Server.slnx -c Release --no-build --nologo
        - name: 设置镜像仓库名
          script: echo -n "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
          exports:
            info: IMAGE_REPO
        - name: Docker 镜像构建
          script:
            - docker build -t $IMAGE_REPO:latest -t $IMAGE_REPO:$CNB_COMMIT_SHORT .
        - name: 推送镜像（latest）
          script: docker push $IMAGE_REPO:latest
        - name: 推送镜像（commit）
          script: docker push $IMAGE_REPO:$CNB_COMMIT_SHORT

  tag_push:
    - name: 发布版本镜像
      docker:
        image: mcr.microsoft.com/dotnet/sdk:10.0
      runner:
        cpus: 4
      services:
        - docker
      stages:
        - name: 还原依赖
          script: dotnet restore Server.slnx
        - name: 构建
          script: dotnet build Server.slnx -c Release --nologo
        - name: 单元测试
          script: dotnet test Server.slnx -c Release --no-build --nologo
        - name: 设置镜像仓库名
          script: echo -n "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
          exports:
            info: IMAGE_REPO
        - name: Docker 镜像构建
          script:
            - docker build -t $IMAGE_REPO:$CNB_BRANCH -t $IMAGE_REPO:latest .
        - name: 推送镜像（版本 Tag）
          script: docker push $IMAGE_REPO:$CNB_BRANCH
        - name: 推送镜像（latest）
          script: docker push $IMAGE_REPO:latest

# ==============================================================================
# 云原生开发环境：一键启动示例在线服务
# 在仓库分支页点击「云原生开发」按钮触发；stages 结束后环境保留，服务持续运行。
# 通过 WebIDE 的 PORTS 面板（或环境变量 CNB_VSCODE_PROXY_URI）暴露业务端口：
#   28080  Game HTTP API / Swagger（HTTP 预览）
#   28081  Social HTTP API（HTTP 预览）
#   29110  Game WebSocket（HTTPS 代理预览，Web 客户端示例连接入口）
#   29100  Game TCP（需 VS Code 端口转发访问，HTTPS 代理不支持裸 TCP）
# 环境销毁时 endStages 自动清理容器与数据卷。
# ==============================================================================
$:
  vscode:
    - name: 在线示例服务
      docker:
        image: mcr.microsoft.com/dotnet/sdk:10.0
      runner:
        cpus: 4
      services:
        - vscode
        - docker
      stages:
        - name: 安装 Docker Compose
          script:
            - apt-get update
            - apt-get install -y docker-cli docker-compose-plugin
        - name: 构建业务镜像
          script:
            - docker build -t gameframex/server.launcher:local .
        - name: 启动在线服务（MongoDB + Game + Social）
          script:
            - docker compose up -d
            - docker compose ps
      endStages:
        - name: 停止在线服务
          script: docker compose down -v
