services:
  mongo:
    image: mongo:8.2
    container_name: gfx-mongo
    restart: unless-stopped
    ports:
      - "37017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gameframex

  # 单一镜像；启动参数经 GAMEFRAMEX_SERVER_ARGS 原样透传（当前仅启动 Game，Social 后续补充）
  game:
    build:
      context: .
    image: gameframex/server.launcher:local
    container_name: gfx-game
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      GAMEFRAMEX_SERVER_ARGS: "--ServerType=Game --ServerId=1001 --ServerInstanceId=1 --InnerPort=29100 --OuterPort=29100 --HttpPort=28080 --WsPort=29110 --MetricsPort=29090 --MinModuleId=10 --MaxModuleId=9999 --IsEnableOnlineAdmin=true --OnlineTenantId=1 --OnlineAppId=1 --DataBaseUrl=mongodb://mongo:27017/?authSource=admin --DataBaseName=gameframex"
    ports:
      - "39100:29100"
      - "38080:28080"
      - "28090:28090"
    volumes:
      - "./running/game/logs:/app/data/logs"
    networks:
      - gameframex

networks:
  gameframex:
    driver: bridge
