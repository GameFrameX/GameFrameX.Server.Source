services:
  # ── 默认档：MongoDB（双主线之一）── `docker compose up` 即用
  # 示例配置按三档定档默认零依赖 Sqlite（quickstart 载体）；容器内挂载 Mongo 档样例选型：
  # 容器内经服务名互访（Configs/compose/ 下专用配置指向 mongo:27017，宿主机样例保留 127.0.0.1）。
  mongo:
    image: mongo:8.2
    container_name: gfx-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:37017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gameframex

  # 单一镜像；启动参数经 GAMEFRAMEX_SERVER_ARGS 原样透传（当前仅启动 Game，Social 后续补充）。
  # 数据库选型经挂载的 Configs/app_config.json 表达（启动期校验器要求 CLI 与文件一致，文件即选型载体）。
  # 管理 API（28090）无 HTTP 签名验证，仅绑定宿主机回环地址，不对局域网发布。
  game:
    build:
      context: .
    image: gameframex-server:local
    container_name: gfx-game
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - "./Configs/compose/app_config.mongo.json:/app/Configs/app_config.json:ro"
      - "./running/game/logs:/app/data/logs"
    ports:
      - "39100:29100"
      - "38080:28080"
      - "127.0.0.1:28090:28090"
    networks:
      - gameframex

  # ── PostgreSQL 档（双主线之二）：`docker compose --profile postgres up` 启用 ──
  # 与 Mongo 档并列的完整 Provider 示例；两档不共享数据，切换 Provider 不迁移存量数据（无迁移工具，见 README）。
  postgres:
    image: postgres:17
    container_name: gfx-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: gameframex
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gameframex

  game-postgres:
    build:
      context: .
    image: gameframex-server:local
    container_name: gfx-game-postgres
    profiles:
      - postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "./Configs/compose/app_config.postgres.json:/app/Configs/app_config.json:ro"
      - "./running/game-postgres/logs:/app/data/logs"
    ports:
      - "39200:29100"
      - "38081:28080"
      - "127.0.0.1:28091:28090"
    networks:
      - gameframex

networks:
  gameframex:
    driver: bridge

volumes:
  mongo-data:
  postgres-data:
