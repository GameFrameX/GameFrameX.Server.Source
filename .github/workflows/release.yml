name: Publish Release

on:
  push:
    branches: [main1]
  workflow_dispatch:

jobs:
  release:
    uses: GameFrameX/public-github-actions/.github/workflows/publish-dotnet-release.yml@main
    with:
      dotnet_version: "10.0.x"
      version_props_path: "Version.props"
    secrets: inherit

  notify:
    needs: release
    if: needs.release.result == 'success'
    uses: GameFrameX/public-github-actions/.github/workflows/notify.yml@main
    with:
      repository_name: GameFrameX.Server
    secrets: inherit
