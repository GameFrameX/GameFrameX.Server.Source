name: Publish Release

on:
# 发布仅手动触发（workflow_dispatch），push 自动发布以注释形式退役；
# 版本号仍由共享流水线按提交历史自动推断，发布链路不变。恢复自动发布：取消下两行注释即可。
# push:
#   branches: [main]
  workflow_dispatch:

jobs:
  # 数据库契约双绿门禁：PG + Mongo 双主线全验证档的发布前提
  # （A1 裁决：DatabaseConditionalWritePrimitivesTests + 可翻译子集契约在两家 Provider 上必须全部通过；
  # Sqlite 档随套件常开，作为零依赖上手+测试档的回归网）。
  database-contract-gate:
    name: Database Contract Gate (PostgreSQL + MongoDB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gameframex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GAMEFRAMEX_TEST_MONGODB_CONNECTION_STRING: mongodb://localhost:27017
      GAMEFRAMEX_TEST_POSTGRESQL_CONNECTION_STRING: 'Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres'
    steps:
      # Mongo 以单节点副本集运行（独立 service 容器无法传 mongod 参数）：
      # 发布门禁必须实际执行事务回滚/嵌套断言（hello.setName 探测），不能停在独立服务跳过路径。
      # 独立服务的跳过路径由 topology-equivalence 工作流的常开 mongo service 覆盖。
      - name: Start MongoDB Single-Node Replica Set
        run: |
          docker run -d --name mongo-replica-set -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec mongo-replica-set mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; then break; fi
            sleep 2
          done
          docker exec mongo-replica-set mongosh --quiet --eval "try { rs.initiate({ _id: 'rs0', members: [ { _id: 0, host: 'localhost:27017' } ] }) } catch (error) { }"
          for attempt in $(seq 1 30); do
            if docker exec mongo-replica-set mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "mongodb replica set did not become primary in time" >&2
          exit 1
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Server.slnx

      - name: Build
        run: dotnet build Server.slnx --no-restore --no-incremental -warnaserror:CS9057

      - name: Run Database Contract Suite (SQLite always + PostgreSQL + MongoDB)
        run: >
          dotnet test Tests/GameFrameX.Tests/GameFrameX.Tests.csproj --no-build
          --filter "FullyQualifiedName~GameFrameX.Tests.DataBase"
          --logger GitHubActions

  release:
    needs: database-contract-gate
    permissions:
      contents: write
      packages: write
    uses: GameFrameX/public-github-actions/.github/workflows/publish-dotnet-release.yml@main
    with:
      dotnet_version: "10.0.x"
      version_props_path: "Version.props"
    secrets: inherit

  publish-nuget:
    needs: release
    if: ${{ needs.release.outputs.release_needed == 'true' && needs.release.outputs.nuget_packages == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Publish with NuGet Trusted Publishing
        uses: GameFrameX/public-github-actions/.github/actions/publish-nuget@main
        with:
          package-path: ./artifacts/*.nupkg
          nuget-user: ${{ secrets.NUGET_USER }}
