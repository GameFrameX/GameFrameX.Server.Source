name: Publish Release

on:
# 发布仅手动触发（workflow_dispatch），push 自动发布以注释形式退役；
# 版本号仍由共享流水线按提交历史自动推断，发布链路不变。恢复自动发布：取消下两行注释即可。
# push:
#   branches: [main]
  workflow_dispatch:

jobs:
  release:
    # GITHUB_TOKEN 权限由复用工作流内部统一声明（contents: write / packages: write），调用方无需重复声明。
    uses: GameFrameX/public-github-actions/.github/workflows/publish-dotnet-release.yml@main
    with:
      dotnet_version: "10.0.x"
      version_props_path: "Version.props"
    # 上游 publish-dotnet-release.yml 未声明 on.workflow_call.secrets
    # （NUGET_API_KEY / DOCKERHUB_* / BLUESKY_APP_PASSWORD 靠 inherit 透传），
    # 改显式列表会导致发布链路拿不到凭据；如需收敛，先在 public-github-actions 补 secrets 声明。
    secrets: inherit
