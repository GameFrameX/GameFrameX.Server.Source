name: Publish Release

on:
# 发布仅手动触发（workflow_dispatch），push 自动发布以注释形式退役；
# 版本号仍由共享流水线按提交历史自动推断，发布链路不变。恢复自动发布：取消下两行注释即可。
# push:
#   branches: [main]
  workflow_dispatch:

jobs:
  # 数据库契约双绿门禁：PG + Mongo 双主线全验证档的发布前提
  # （A1 裁决：DatabaseConditionalWritePrimitivesTests + 可翻译子集契约在两家 Provider 上必须全部通过；
  # Sqlite 档随套件常开，作为零依赖上手+测试档的回归网）。
  database-contract-gate:
    name: Database Contract Gate (PostgreSQL + MongoDB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gameframex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GAMEFRAMEX_TEST_MONGODB_CONNECTION_STRING: mongodb://localhost:27017
      GAMEFRAMEX_TEST_POSTGRESQL_CONNECTION_STRING: 'Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Server.slnx

      - name: Build
        run: dotnet build Server.slnx --no-restore

      - name: Run Database Contract Suite (SQLite always + PostgreSQL + MongoDB)
        run: >
          dotnet test Tests/GameFrameX.Tests/GameFrameX.Tests.csproj --no-build
          --filter "FullyQualifiedName~GameFrameX.Tests.DataBase.DatabaseConditionalWritePrimitivesTests|FullyQualifiedName~GameFrameX.Tests.DataBase.DatabaseExecuteInTransactionAtomicityTests|FullyQualifiedName~GameFrameX.Tests.DataBase.SqlitePredicatePushdownTests|FullyQualifiedName~GameFrameX.Tests.DataBase.PostgreSqlDbServiceQueryTests|FullyQualifiedName~GameFrameX.Tests.DataBase.MongoDbServiceQueryTests"
          --logger GitHubActions

  release:
    needs: database-contract-gate
    # GITHUB_TOKEN 权限由复用工作流内部统一声明（contents: write / packages: write），调用方无需重复声明。
    uses: GameFrameX/public-github-actions/.github/workflows/publish-dotnet-release.yml@main
    with:
      dotnet_version: "10.0.x"
      version_props_path: "Version.props"
    # 上游 publish-dotnet-release.yml 未声明 on.workflow_call.secrets
    # （NUGET_API_KEY / DOCKERHUB_* / BLUESKY_APP_PASSWORD 靠 inherit 透传），
    # 改显式列表会导致发布链路拿不到凭据；如需收敛，先在 public-github-actions 补 secrets 声明。
    secrets: inherit
