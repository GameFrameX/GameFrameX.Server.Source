name: Topology Equivalence Gate

# C143c D9：跨 Role 消息链路语义等价 CI 门禁。
# 4 条代表性链路 × 2 拓扑（All-in-One 单进程 / 三进程）在同一套固定预期下运行，
# 任一用例失败即阻塞合并。这是 DynamicPhase-0 核心契约（AC-2）的守护门。
# C143d：套件扩入 Discovery（地址格式 / 双视图路由 / Mongo 心跳集成用例），
# sidecar Mongo 让 GAMEFRAMEX_TEST_MONGODB_CONNECTION_STRING 门控的集成用例真跑。
# C166：sidecar PostgreSQL 让 GAMEFRAMEX_TEST_POSTGRESQL_CONNECTION_STRING 门控的
# PG 契约 + 发现层平行实现用例真跑（门控模式对齐 Mongo；filter 扩 FullyQualifiedName~PostgreSql）。

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  topology-equivalence:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gameframex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GAMEFRAMEX_TEST_MONGODB_CONNECTION_STRING: mongodb://localhost:27017
      GAMEFRAMEX_TEST_POSTGRESQL_CONNECTION_STRING: 'Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Server.slnx

      - name: Build
        run: dotnet build Server.slnx --no-restore

      - name: Run Topology Equivalence Suite
        run: >
          dotnet test Tests/GameFrameX.Tests/GameFrameX.Tests.csproj --no-build
          --filter "FullyQualifiedName~GameFrameX.Tests.Topology.Equivalence|FullyQualifiedName~GameFrameX.Tests.Discovery|FullyQualifiedName~GameFrameX.Tests.DataBase.PostgreSqlDbServiceQueryTests"
          --logger GitHubActions
