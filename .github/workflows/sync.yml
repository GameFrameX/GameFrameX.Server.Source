name: Sync Github To Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

# 镜像同步仅需读取仓库信息（Gitee/CNB 推送走专用 token）
permissions:
  contents: read

jobs:
  sync:
    uses: GameFrameX/public-github-actions/.github/workflows/sync.yml@main
    with:
      target_branch: ${{ github.ref_name }}
      repository_name: ${{ github.repository }}
    # 上游 sync.yml 未声明 on.workflow_call.secrets（GITEE/CNB token 靠 inherit 透传），
    # 改显式列表会导致同步链路拿不到凭据；如需收敛，先在 public-github-actions 补 secrets 声明。
    secrets: inherit
