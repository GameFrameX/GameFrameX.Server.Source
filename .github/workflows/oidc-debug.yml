name: OIDC Claims Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Mint nuget-audience token and print claims only
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://www.nuget.org")
          token=$(echo "$resp" | jq -r .value)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "failed to mint OIDC token" >&2; exit 1
          fi
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          [ "$pad" -ne 0 ] && payload="$payload$(printf '%*s' "$pad" '' | tr ' ' '=')"
          echo "=== OIDC claims (token itself NOT printed) ==="
          printf '%s' "$payload" | base64 -d | jq '{aud, repository, repository_owner, repository_owner_id, workflow, workflow_ref, environment, ref, event_name, actor, iss}'
